[project]
name = "learning-fast-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rs6739171-hash", email = "rs6739171@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.162.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "sqlmodel>=0.0.48",
]

[project.scripts]
learning-fast-api = "learning_fast_api:main"

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
